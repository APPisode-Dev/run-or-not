name: Deploy Android

on:
  push:
    tags:
      - "android-v*"

concurrency:
  group: deploy-android
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FASTLANE_OPT_OUT_USAGE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Restore Android signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/app/key.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > google-play-service-account.json

      - name: Inspect Android deployment context
        shell: bash
        run: |
          echo "::group::Android deployment context"
          echo "working_directory=$(pwd)"
          echo "repository_root=$(git rev-parse --show-toplevel)"
          echo "git_ref_name=$GITHUB_REF_NAME"
          echo "git_sha=$GITHUB_SHA"
          test -f pubspec.yaml && echo "pubspec.yaml=found" || { echo "pubspec.yaml=missing"; exit 1; }
          grep '^version:' pubspec.yaml
          test -f fastlane/Fastfile && echo "fastlane/Fastfile=found" || { echo "fastlane/Fastfile=missing"; exit 1; }
          test -f lib/app/main.dart && echo "lib/app/main.dart=found" || { echo "lib/app/main.dart=missing"; exit 1; }
          test -f google-play-service-account.json && echo "service_account_json=found" || { echo "service_account_json=missing"; exit 1; }
          test -f android/app/release.jks && echo "release_keystore=found" || { echo "release_keystore=missing"; exit 1; }
          ruby --version
          bundle --version
          flutter --version
          java -version
          echo "gradle_wrapper=$(sed -n 's|.*gradle-\([0-9.]*\)-.*|\1|p' android/gradle/wrapper/gradle-wrapper.properties)"
          echo "android_gradle_plugin=$(sed -n 's/.*com.android.application.*version "\([^"]*\)".*/\1/p' android/settings.gradle.kts)"
          echo "kotlin_gradle_plugin=$(sed -n 's/.*org.jetbrains.kotlin.android.*version "\([^"]*\)".*/\1/p' android/settings.gradle.kts)"
          echo "::endgroup::"

      - name: Deploy Android
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PATH: google-play-service-account.json
          ANDROID_PACKAGE_NAME: com.appisode.run_or_not
          ANDROID_TRACK: internal
          ANDROID_RELEASE_STATUS: draft
          ANDROID_CHANGES_NOT_SENT_FOR_REVIEW: "true"
          ANDROID_DEPLOY_TAG: ${{ github.ref_name }}
        run: bundle exec fastlane android deploy
